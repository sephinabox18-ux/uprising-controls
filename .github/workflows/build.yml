name: Build Azahar KIU

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: kiu-build
  cancel-in-progress: true

env:
  AZAHAR_TAG: "2126.2"

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: time_macros
    steps:
      - name: Get this repo (patch + signing key)
        uses: actions/checkout@v4
        with:
          path: kiu

      - name: Get Azahar source
        run: |
          git clone --depth 1 --branch "$AZAHAR_TAG" --recurse-submodules --shallow-submodules \
            https://github.com/azahar-emu/azahar.git azahar

      - name: Apply KIU changes
        working-directory: azahar
        run: |
          git apply --whitespace=nowarn ../kiu/.github/workflows/kiu.patch
          grep -o 'KIU_VERSION = "[^"]*"' src/android/app/src/main/java/org/citra/citra_emu/overlay/KiuController.kt

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ${{ env.CCACHE_DIR }}
          key: kiu-${{ env.AZAHAR_TAG }}-${{ github.sha }}
          restore-keys: |
            kiu-${{ env.AZAHAR_TAG }}-

      - name: Install tools
        run: |
          sudo apt-get update -y
          sudo apt-get install ccache -y
          echo "y" | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "cmake;3.30.3"

      - name: Build APK
        working-directory: azahar/src/android
        env:
          ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/kiu/.github/workflows/kiu-signing.jks
          ANDROID_KEY_ALIAS: kiu
          ANDROID_KEYSTORE_PASS: kiupassword
        run: |
          export NDK_CCACHE=$(which ccache)
          export JAVA_HOME=$JAVA_HOME_17_X64
          chmod +x ./gradlew
          ./gradlew assembleVanillaRelease
          mkdir -p $GITHUB_WORKSPACE/out
          APK=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then echo "No APK was produced"; exit 1; fi
          cp "$APK" $GITHUB_WORKSPACE/out/Azahar-KIU-build-${{ github.run_number }}.apk
          ls -la $GITHUB_WORKSPACE/out

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kiu-build-${{ github.run_number }}
          name: Azahar KIU build ${{ github.run_number }}
          body: Built from commit ${{ github.sha }}. Download the .apk below and install it over the old app.
          files: out/*.apk
          make_latest: true
